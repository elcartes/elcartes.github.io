
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mobile Web Layout</title>

    <!-- BOOTSTRAP CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: #e9ecef;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* APP CONTAINER */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;

            background: #ffffff;

            display: flex;
            flex-direction: column;

            overflow: hidden;
            position: relative;

            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        /* HEADER */
        .app-header {
            height: 60px;
            min-height: 60px;

            background: #212529;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;

            position: relative;
            z-index: 10;
        }

        .app-header .logo {
            font-size: 18px;
            font-weight: bold;
        }

        /* CONTENTS */
        .app-contents {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 16px;

            background: #f8f9fa;

            -webkit-overflow-scrolling: touch;
        }

        /* FOOTER */
        .app-footer {
            height: 60px;
            min-height: 60px;

            background: #ffffff;
            border-top: 1px solid #dee2e6;

            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .footer-item {
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            cursor: pointer;
        }

        .footer-item.active {
            color: #0d6efd;
            font-weight: bold;
        }

        /* =================================
           RIGHT SLIDE MENU
        ================================= */

        /* 메뉴 배경 오버레이 */
        .menu-overlay {
            position: absolute;
            inset: 0;

            background: rgba(0, 0, 0, 0.5);

            opacity: 0;
            visibility: hidden;

            transition: opacity 0.3s ease,
                        visibility 0.3s ease;

            z-index: 20;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 우측 슬라이드 메뉴 */
        .side-menu {
            position: absolute;

            top: 0;
            right: 0;

            width: 280px;
            max-width: 85%;
            height: 100%;

            background: #ffffff;

            transform: translateX(100%);
            transition: transform 0.3s ease;

            z-index: 30;

            display: flex;
            flex-direction: column;

            box-shadow: -5px 0 20px rgba(0,0,0,0.15);
        }

        .side-menu.active {
            transform: translateX(0);
        }

        /* 메뉴 헤더 */
        .side-menu-header {
            height: 60px;
            min-height: 60px;

            background: #212529;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        .side-menu-title {
            font-size: 17px;
            font-weight: bold;
        }

        .menu-close {
            background: none;
            border: none;
            color: white;

            font-size: 28px;
            line-height: 1;

            cursor: pointer;
        }

        /* 메뉴 콘텐츠 */
        .side-menu-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .side-menu-item {
            display: flex;
            align-items: center;

            padding: 16px 20px;

            color: #343a40;
            text-decoration: none;

            font-size: 15px;

            border-bottom: 1px solid #f1f1f1;

            transition: background 0.2s;
        }

        .side-menu-item:hover {
            background: #f1f3f5;
            color: #0d6efd;
        }

        .side-menu-item .menu-icon {
            width: 35px;
            font-size: 19px;
        }

        /* 메뉴 하단 */
        .side-menu-footer {
            padding: 20px;
            border-top: 1px solid #dee2e6;

            font-size: 12px;
            color: #adb5bd;
            text-align: center;
        }

        /* PC / TABLET */
        @media (min-width: 431px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .app-container {
                height: min(100dvh, 900px);
                border-radius: 12px;
            }
        }

    </style>
</head>

<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="app-header">

        <div class="logo">
            MY APP
        </div>

        <button class="btn btn-outline-light btn-sm"
                id="menuButton"
                aria-label="메뉴 열기"
                aria-expanded="false"
                aria-controls="sideMenu">

            ☰ 메뉴

        </button>

    </header>


    <!-- CONTENTS -->
    <main class="app-contents">

        <h5 class="fw-bold mb-3">
            메인 콘텐츠
        </h5>

        <div class="card shadow-sm mb-3">
            <div class="card-body">

                <h6 class="card-title">
                    모바일 화면 테스트
                </h6>

                <p class="card-text text-secondary">
                    PC, 태블릿, 모바일에서 동일한 모바일
                    화면 폭으로 표시됩니다.
                </p>

                <button class="btn btn-primary w-100"
                        id="testButton">

                    버튼 테스트

                </button>

            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h6>콘텐츠 영역 2</h6>
                <p class="text-secondary mb-0">
                    콘텐츠가 길어지면 이 영역만 스크롤됩니다.
                </p>
            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h6>콘텐츠 영역 3</h6>
                <p class="text-secondary mb-0">
                    Header와 Footer는 고정됩니다.
                </p>
            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h6>콘텐츠 영역 4</h6>
                <p class="text-secondary mb-0">
                    필요한 만큼 콘텐츠를 추가할 수 있습니다.
                </p>
            </div>
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="app-footer">

        <div class="footer-item active" data-menu="home">
            <div>⌂</div>
            <div>홈</div>
        </div>

        <div class="footer-item" data-menu="search">
            <div>⌕</div>
            <div>검색</div>
        </div>

        <div class="footer-item" data-menu="mypage">
            <div>♙</div>
            <div>마이페이지</div>
        </div>

    </footer>


    <!-- =================================
         RIGHT SLIDE MENU OVERLAY
    ================================== -->

    <div class="menu-overlay" id="menuOverlay"></div>


    <!-- RIGHT SLIDE MENU -->
    <aside class="side-menu"
           id="sideMenu"
           aria-label="전체 메뉴"
           aria-hidden="true"
           inert>

        <!-- MENU HEADER -->
        <div class="side-menu-header">

            <div class="side-menu-title">
                전체 메뉴
            </div>

            <button class="menu-close"
                    id="closeMenu"
                    aria-label="메뉴 닫기">

                &times;

            </button>

        </div>


        <!-- MENU CONTENT -->
        <nav class="side-menu-content">

            <a href="#" class="side-menu-item">
                <span class="menu-icon">⌂</span>
                홈
            </a>

            <a href="#" class="side-menu-item">
                <span class="menu-icon">⌕</span>
                검색
            </a>

            <a href="#" class="side-menu-item">
                <span class="menu-icon">♙</span>
                마이페이지
            </a>

            <a href="#" class="side-menu-item">
                <span class="menu-icon">⚙</span>
                설정
            </a>

            <a href="#" class="side-menu-item">
                <span class="menu-icon">♧</span>
                고객센터
            </a>

            <a href="#" class="side-menu-item">
                <span class="menu-icon">ⓘ</span>
                앱 정보
            </a>

        </nav>


        <!-- MENU FOOTER -->
        <div class="side-menu-footer">
            MY MOBILE APP v1.0
        </div>

    </aside>

</div>


<!-- BOOTSTRAP JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<!-- VANILLA JAVASCRIPT -->
<script>

    const menuButton = document.getElementById('menuButton');
    const closeMenu = document.getElementById('closeMenu');
    const sideMenu = document.getElementById('sideMenu');
    const menuOverlay = document.getElementById('menuOverlay');

    // 메뉴 열기
    function openMenu() {

        sideMenu.classList.add('active');
        menuOverlay.classList.add('active');

        sideMenu.setAttribute('aria-hidden', 'false');
        sideMenu.removeAttribute('inert');

        menuButton.setAttribute('aria-expanded', 'true');

        document.body.style.overflow = 'hidden';

        closeMenu.focus();

    }

    // 메뉴 닫기
    function hideMenu() {

        sideMenu.classList.remove('active');
        menuOverlay.classList.remove('active');

        sideMenu.setAttribute('aria-hidden', 'true');
        sideMenu.setAttribute('inert', '');

        menuButton.setAttribute('aria-expanded', 'false');

        document.body.style.overflow = '';

        menuButton.focus();

    }

    // 헤더 메뉴 버튼
    menuButton.addEventListener('click', openMenu);

    // 닫기 버튼
    closeMenu.addEventListener('click', hideMenu);

    // 배경 클릭 시 닫기
    menuOverlay.addEventListener('click', hideMenu);

    // ESC 키로 닫기
    document.addEventListener('keydown', function(e) {

        if (e.key === 'Escape' &&
            sideMenu.classList.contains('active')) {

            hideMenu();

        }

    });


    // 버튼 테스트
    document.getElementById('testButton')
        .addEventListener('click', function() {

            alert('버튼이 정상적으로 동작합니다.');

        });


    // Footer 메뉴 선택
    document.querySelectorAll('.footer-item')
        .forEach(function(item) {

            item.addEventListener('click', function() {

                document.querySelectorAll('.footer-item')
                    .forEach(function(el) {
                        el.classList.remove('active');
                    });

                this.classList.add('active');

                console.log('선택 메뉴:', this.dataset.menu);

            });

        });


    // 슬라이드 메뉴 항목 클릭
    document.querySelectorAll('.side-menu-item')
        .forEach(function(item) {

            item.addEventListener('click', function(e) {

                e.preventDefault();

                console.log('선택 메뉴:', this.textContent.trim());

                hideMenu();

            });

        });

</script>

</body>
</html>
