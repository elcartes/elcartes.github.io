<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Mobile Web Layout</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            background: #e9ecef;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        /* =================================
           APP CONTAINER
        ================================= */

        .app-container {
            width: 100%;
            max-width: 430px;

            height: 100vh;
            height: 100dvh;

            margin: 0 auto;

            background: #ffffff;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            position: relative;

            isolation: isolate;

            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }


        /* =================================
           NAVBAR HEADER
        ================================= */

        .app-header {
            height: 60px;
            min-height: 60px;

            background: #212529;

            position: relative;
            z-index: 10;

            padding: 0;
        }

        .app-header .container-fluid {
            height: 100%;

            padding: 0 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-brand {
            color: #ffffff !important;

            font-size: 18px;
            font-weight: bold;

            margin: 0;
        }

        .navbar-nav {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .navbar-nav .nav-item {
            list-style: none;
        }


        /* =================================
           MENU BUTTON
        ================================= */

        .btn-solid {
            border: 1px solid #6c757d;

            border-radius: 5px;

            padding: 6px 12px;

            font-size: 13px;

            cursor: pointer;
        }

        .theme-secondary {
            background: #495057;
            color: #ffffff;
        }

        .theme-secondary:hover {
            background: #6c757d;
            color: #ffffff;
        }


        /* =================================
           CONTENTS
        ================================= */

        .app-contents {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 16px;

            background: #f8f9fa;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior: contain;
        }


        /* =================================
           FOOTER
        ================================= */

        .app-footer {
            min-height: 45px;
            height: 45px;
            flex-shrink: 0;

            background: #ffffff;

            border-top: 1px solid #dee2e6;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 10px;

            font-size: 11px;
            color: #6c757d;

            white-space: nowrap;
            overflow: hidden;
        }

        .footer-info {
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer-info a {
            color: #6c757d;
            text-decoration: none;
            margin: 0 4px;
        }

        .footer-info a:hover {
            color: #0d6efd;
        }


        /* =================================
           MENU OVERLAY
        ================================= */

        .menu-overlay {
            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.5);

            opacity: 0;
            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 20;

            transform: translateZ(0);

            backface-visibility: hidden;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;

            pointer-events: auto;
        }


        /* =================================
           RIGHT SLIDE MENU
           NAVBAR MENU STRUCTURE
        ================================= */

        .menu {
            position: absolute;

            top: 0;
            right: 0;

            width: 280px;
            max-width: 85%;

            height: 100%;

            background: #ffffff;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            box-shadow: -5px 0 20px rgba(0,0,0,0.15);

            /* 슬라이드 애니메이션 */
            transform: translate3d(100%, 0, 0);

            transition: transform 0.25s ease;

            will-change: transform;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            z-index: 30;

            pointer-events: none;
        }

        .menu.active {
            transform: translate3d(0, 0, 0);

            pointer-events: auto;
        }


        /* =================================
           MENU HEADER
        ================================= */

        .menu-header {
            height: 60px;
            min-height: 60px;

            background: #212529;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        .menu-title {
            font-size: 17px;
            font-weight: bold;
        }

        .menu-close {
            background: none;
            border: none;

            color: #ffffff;

            font-size: 28px;
            line-height: 1;

            cursor: pointer;
        }


        /* =================================
           MENU ITEMS
        ================================= */

        .menu-content {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 15px 0;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior: contain;
        }

        .menu-item {
            display: flex;
            align-items: center;

            padding: 16px 20px;

            color: #343a40;

            text-decoration: none;

            font-size: 15px;

            border-bottom: 1px solid #f1f1f1;

            transition: background 0.2s;
        }

        .menu-item:hover {
            background: #f1f3f5;
            color: #0d6efd;
        }

        .menu-icon {
            width: 35px;

            font-size: 19px;
        }


        /* =================================
           MENU FOOTER
        ================================= */

        .menu-footer {
            padding: 20px;

            border-top: 1px solid #dee2e6;

            font-size: 12px;
            color: #adb5bd;

            text-align: center;
        }


        /* =================================
           PC / TABLET
        ================================= */

        @media (min-width: 431px) {

            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .app-container {
                height: min(100dvh, 900px);

                border-radius: 12px;
            }

        }


        /* =================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {

            .menu,
            .menu-overlay {
                transition: none;
            }

        }

    </style>
</head>


<body>

<div class="app-container">


    <!-- =================================
         NAVBAR HEADER
    ================================= -->

    <nav class="navbar app-header" data-bs-theme="dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                MY APP
            </a>


            <ul class="navbar-nav">

                <li class="nav-item">

                    <button class="btn-solid theme-secondary"
                            type="button"
                            data-bs-toggle="menu"
                            aria-expanded="false"
                            aria-controls="sideMenu"
                            id="menuButton">

                        ☰ 메뉴

                    </button>

                </li>

            </ul>

        </div>

    </nav>



    <!-- =================================
         CONTENTS
    ================================= -->

    <main class="app-contents">

        <h5 class="fw-bold mb-3">
            메인 콘텐츠
        </h5>


        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <h6 class="card-title">
                    모바일 화면 테스트
                </h6>

                <p class="card-text text-secondary">
                    PC, 태블릿, 모바일에서 동일한 모바일
                    화면 폭으로 표시됩니다.
                </p>

                <button class="btn btn-primary w-100"
                        id="testButton">

                    버튼 테스트

                </button>

            </div>

        </div>


        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <h6>콘텐츠 영역 2</h6>

                <p class="text-secondary mb-0">
                    콘텐츠가 길어지면 이 영역만 스크롤됩니다.
                </p>

            </div>

        </div>


        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <h6>콘텐츠 영역 3</h6>

                <p class="text-secondary mb-0">
                    Header와 Footer는 고정됩니다.
                </p>

            </div>

        </div>


        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <h6>콘텐츠 영역 4</h6>

                <p class="text-secondary mb-0">
                    필요한 만큼 콘텐츠를 추가할 수 있습니다.
                </p>

            </div>

        </div>

    </main>



    <!-- =================================
         FOOTER
    ================================= -->

    <footer class="app-footer">

        <div class="footer-info">

            <span>© 2026 MY APP</span>

            <span>|</span>

            <a href="#">회사소개</a>

            <span>|</span>

            <a href="#">이용약관</a>

            <span>|</span>

            <a href="#">개인정보처리방침</a>

            <span>|</span>

            <a href="#">고객센터</a>

        </div>

    </footer>



    <!-- =================================
         MENU OVERLAY
    ================================= -->

    <div class="menu-overlay"
         id="menuOverlay">
    </div>



    <!-- =================================
         NAVBAR SLIDE MENU
    ================================= -->

    <ul class="navbar-nav">

        <li class="nav-item" data-bs-theme="dark">

            <div class="menu"
                 id="sideMenu"
                 aria-label="전체 메뉴"
                 aria-hidden="true"
                 inert>


                <!-- MENU HEADER -->

                <div class="menu-header">

                    <div class="menu-title">
                        전체 메뉴
                    </div>

                    <button class="menu-close"
                            type="button"
                            id="closeMenu"
                            aria-label="메뉴 닫기">

                        &times;

                    </button>

                </div>



                <!-- MENU CONTENT -->

                <nav class="menu-content">

                    <a class="menu-item" href="#">
                        <span class="menu-icon">⌂</span>
                        홈
                    </a>

                    <a class="menu-item" href="#">
                        <span class="menu-icon">⌕</span>
                        검색
                    </a>

                    <a class="menu-item" href="#">
                        <span class="menu-icon">♙</span>
                        마이페이지
                    </a>

                    <a class="menu-item" href="#">
                        <span class="menu-icon">⚙</span>
                        설정
                    </a>

                    <a class="menu-item" href="#">
                        <span class="menu-icon">♧</span>
                        고객센터
                    </a>

                    <a class="menu-item" href="#">
                        <span class="menu-icon">ⓘ</span>
                        앱 정보
                    </a>

                </nav>



                <!-- MENU FOOTER -->

                <div class="menu-footer">
                    MY MOBILE APP v1.0
                </div>


            </div>

        </li>

    </ul>


</div>



<!-- =================================
     BOOTSTRAP JAVASCRIPT
================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



<!-- =================================
     VANILLA JAVASCRIPT
================================= -->

<script>

    const menuButton = document.getElementById('menuButton');

    const closeMenu = document.getElementById('closeMenu');

    const sideMenu = document.getElementById('sideMenu');

    const menuOverlay = document.getElementById('menuOverlay');


    // =================================
    // 메뉴 열기
    // =================================

    function openMenu() {

        sideMenu.classList.add('active');

        menuOverlay.classList.add('active');

        sideMenu.setAttribute('aria-hidden', 'false');

        sideMenu.removeAttribute('inert');

        menuButton.setAttribute('aria-expanded', 'true');

        closeMenu.focus();

    }


    // =================================
    // 메뉴 닫기
    // =================================

    function hideMenu() {

        sideMenu.classList.remove('active');

        menuOverlay.classList.remove('active');

        sideMenu.setAttribute('aria-hidden', 'true');

        sideMenu.setAttribute('inert', '');

        menuButton.setAttribute('aria-expanded', 'false');

        menuButton.focus();

    }


    // =================================
    // NAVBAR MENU BUTTON
    // =================================

    menuButton.addEventListener('click', function() {

        if (sideMenu.classList.contains('active')) {

            hideMenu();

        } else {

            openMenu();

        }

    });


    // =================================
    // CLOSE BUTTON
    // =================================

    closeMenu.addEventListener('click', hideMenu);


    // =================================
    // OVERLAY CLICK
    // =================================

    menuOverlay.addEventListener('click', hideMenu);


    // =================================
    // ESC KEY
    // =================================

    document.addEventListener('keydown', function(e) {

        if (
            e.key === 'Escape' &&
            sideMenu.classList.contains('active')
        ) {

            hideMenu();

        }

    });


    // =================================
    // TEST BUTTON
    // =================================

    document.getElementById('testButton')
        .addEventListener('click', function() {

            alert('버튼이 정상적으로 동작합니다.');

        });


    // =================================
    // MENU ITEM CLICK
    // =================================

    document.querySelectorAll('.menu-item')
        .forEach(function(item) {

            item.addEventListener('click', function(e) {

                e.preventDefault();

                console.log(
                    '선택 메뉴:',
                    this.textContent.trim()
                );

                hideMenu();

            });

        });


</script>

</body>
</html>
